<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行迹 · 城市数据管理后台</title>
<style>
:root{
  --nav:#1c2532; --nav2:#263243; --pri:#2f6f63; --pri2:#e7f2ef; --line:#e3e8ee;
  --ink:#1c2533; --ink2:#5a6675; --mute:#8b96a5; --bg:#f4f6f9; --card:#fff;
  --warn:#c2692f; --warnbg:#fff4e9; --danger:#c0392b; --dangerbg:#fdecea; --ok:#2f7d5b;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
button{cursor:pointer}
a{color:var(--pri);text-decoration:none}
.app{display:flex;height:100vh;overflow:hidden}
/* ---------- 侧栏 ---------- */
.side{width:220px;flex:0 0 220px;background:var(--nav);color:#cfd8e3;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;font-size:16px;color:#fff;letter-spacing:1px}
.brand small{font-size:11px;color:#8fa0b4}
.side-menu{padding:10px 0;flex:1;overflow:auto}
.side-menu .grp{font-size:10px;color:#6f8197;letter-spacing:1.5px;padding:12px 18px 5px}
.side-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfd8e3;padding:9px 18px;font-size:13px;border-left:3px solid transparent}
.side-menu button:hover{background:var(--nav2);color:#fff}
.side-menu button.on{background:var(--nav2);color:#fff;border-left-color:#5bb59c}
.side-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8294a9}
.side-foot a{color:#9fd6c5}
/* ---------- 主区 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
.top h1{font-size:15px;margin:0;font-weight:650}
.top .crumb{color:var(--mute);font-size:12px}
.top .sp{flex:1}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:var(--pri2);color:var(--pri);border:1px solid #cfe6df}
.badge.gray{background:#f1f3f6;color:var(--ink2);border-color:var(--line)}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:#f2d5b5}
.badge.danger{background:var(--dangerbg);color:var(--danger);border-color:#f3c8c3}
.btn{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:6px;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#276054;color:#fff}
.btn.danger{color:var(--danger);border-color:#f0c9c4}
.btn.danger:hover{background:var(--dangerbg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.view{flex:1;overflow:auto;padding:20px 22px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:650}
.card h3{font-size:13px;margin:16px 0 8px;font-weight:650;color:var(--ink2)}
.note{background:var(--pri2);border:1px solid #cfe6df;border-radius:6px;padding:10px 12px;color:#2c6155;font-size:12px;margin-bottom:14px}
.note.warn{background:var(--warnbg);border-color:#f2d5b5;color:#8a4a1f}
.note b{font-weight:650}
/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat span{font-size:11px;color:var(--mute);display:block}
.stat b{font-size:23px;display:block;margin-top:4px;color:var(--ink)}
.stat i{font-style:normal;font-size:11px;color:var(--mute)}
/* ---------- 工具条 ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=text],.toolbar input[type=search],.toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:#fff;height:32px}
.toolbar input[type=text],.toolbar input[type=search]{min-width:210px}
.toolbar .sp{flex:1}
.hint{font-size:11px;color:var(--mute)}
/* ---------- 表格 ---------- */
.tbl-wrap{border:1px solid var(--line);border-radius:6px;overflow:auto;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{background:#f7f9fb;color:var(--ink2);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:8px 10px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
table.tbl tr:hover td{background:#fafcfb}
table.tbl tr.is-hidden td{opacity:.55}
.cell-city{display:flex;align-items:center;gap:8px;min-width:170px}
.thumb{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:0 0 28px}
.cell-city b{font-weight:600}
.cell-city small{display:block;color:var(--mute);font-size:10px}
.acts{white-space:nowrap}
.acts button{border:0;background:none;color:var(--pri);padding:2px 5px;font-size:12px}
.acts button:hover{text-decoration:underline}
.acts button.del{color:var(--danger)}
.pager{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ink2)}
.pager .sp{flex:1}
.empty{padding:30px;text-align:center;color:var(--mute)}
/* ---------- 表单 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
.f label{display:block;font-size:11px;color:var(--ink2);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.f textarea{resize:vertical;min-height:56px}
.f .sub{font-size:10px;color:var(--mute)}
.sec-title{font-size:12px;font-weight:650;color:var(--ink2);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12px}
.mini-tbl th{background:#f7f9fb;color:var(--ink2);font-weight:600;padding:6px;border:1px solid var(--line);text-align:left}
.mini-tbl td{padding:3px;border:1px solid var(--line)}
.mini-tbl input{width:100%;border:0;padding:4px 5px;background:transparent}
.mini-tbl input:focus{outline:1px solid var(--pri);background:#fff}
.rowbtns{display:flex;gap:4px;justify-content:center}
.rowbtns button{border:0;background:#f1f3f6;border-radius:4px;color:var(--ink2);padding:1px 6px;font-size:11px}
/* ---------- 抽屉 ---------- */
.drawer-mask{position:fixed;inset:0;background:rgba(18,26,36,.42);display:none;z-index:40}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:#fff;z-index:41;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.drawer-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.drawer-h b{font-size:15px}
.drawer-h .sp{flex:1}
.drawer-b{flex:1;overflow:auto;padding:16px 18px}
.drawer-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fbfcfd}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12.5px}
.kv b{color:var(--ink2);font-weight:600}
.kv div{word-break:break-all}
/* ---------- 其它 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1c2532;color:#fff;padding:9px 18px;border-radius:22px;opacity:0;transition:.22s;z-index:60;pointer-events:none;font-size:13px;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.logs{max-height:360px;overflow:auto}
.log{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:12px}
.log time{color:var(--mute);flex:0 0 132px}
.log b{flex:0 0 90px;color:var(--pri)}
.log span{color:var(--ink2)}
.drop{border:1px dashed #b9c6d2;border-radius:6px;padding:14px;text-align:center;color:var(--ink2);background:#fafcfd}
textarea.code{width:100%;min-height:150px;border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}
.foot-note{font-size:11px;color:var(--mute);margin-top:8px}
@media(max-width:860px){.side{width:62px;flex-basis:62px}.side .brand b,.side .brand small,.side-menu .grp,.side-menu button span,.side-foot{display:none}.side-menu button{text-align:center;padding:10px 0}.view{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>行迹 · 管理后台</b><small>CITY DATA CONSOLE</small></div>
    <div class="side-menu" id="menu"></div>
    <div class="side-foot">纯静态 · 数据存本机<br><a href="index.html">↗ 返回工作台</a></div>
  </aside>
  <div class="main">
    <div class="top">
      <h1 id="title">概览</h1><span class="crumb" id="crumb">数据总览</span>
      <span class="sp"></span>
      <span class="badge" id="draftBadge">草稿已同步</span>
      <button class="btn" onclick="saveAll(1)">💾 保存草稿</button>
      <button class="btn pri" onclick="go('publish')">📤 发布 / 导出</button>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="drawer-mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-h"><b id="drTitle">详情</b><span class="sp"></span><button class="btn sm" onclick="closeDrawer()">✕ 关闭</button></div>
  <div class="drawer-b" id="drBody"></div>
  <div class="drawer-f" id="drFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script src="data/city-media.js"></script>
<script src="data/cities.full.js"></script>
<script src="data/plan-config.js"></script>
<script src="data/national-cities.js"></script>
<script src="config.js"></script>
<script>
/* =====================================================================
   行迹 · 城市数据管理后台（纯静态 / 无后端 / 无外部依赖）
   数据：data/cities.full.js（410 城完整规划） + data/plan-config.js（全站配置）
   草稿：localStorage xj_admin_v1（后台状态） → 同步 xj_admin_draft_v1（工作台实时预览）
   发布：导出 cities.full.js / plan-config.js → 覆盖仓库文件 → git push → 全站生效
   ===================================================================== */
var KEY = 'xj_admin_v1';
var DRAFT_KEY = 'xj_admin_draft_v1';
var PLAN_DRAFT_KEY = 'xj_plan_draft_v1';
var RAW = (window.XJ_CITIES_FULL && window.XJ_CITIES_FULL.cities) || [];
var META = window.XJ_CITIES_FULL || {};
var NAT = window.XJ_NATIONAL || {};
var REPO_CFG = window.XJ_PLAN_CONFIG || {};

var MENU = [
  ['grp','数据'],
  ['overview','📊','概览'],['cities','🏙','城市管理'],['ai','🤖','AI 采编'],['dict','🗂','分类字典'],
  ['grp','配置'],
  ['theme','🎨','全站视觉'],['publish','📤','导入 / 导出'],['logs','📜','操作日志'],
  ['grp','快捷'],
  ['back','↗','返回工作台']
];

var SCENES = [
  ['老城街区','老城区','1.5h','culture|walk|photo','老街巷与本地日常，适合不设目的地慢慢走'],
  ['滨水步道','滨水一带','1.5h','view|photo|walk','沿水一侧的步行带，傍晚光线最好'],
  ['本地市集','市集周边','1h','food|local|walk','早市或菜场，看本地人怎么买菜吃什么'],
  ['城市博物馆','市中心','1.5h','museum|history|rain','先用一小时把这座城的来龙去脉捋清楚'],
  ['观景高处','近郊','1h','view|photo','找一处能俯瞰全城的开放视角'],
  ['夜间食街','老城区','2h','food|local|night','把没吃到的那几样集中在夜里补齐'],
  ['文创书店街区','历史街区','1.5h','culture|shop|rain','适合午后放慢、躲雨或避晒的室内段'],
  ['近郊自然段','近郊','半天','nature|view|dayTrip','留半天给城外的山或水，注意往返交通'],
  ['老字号茶点','老城区','1h','food|local','坐下来吃一顿本地做法的早点或点心'],
  ['历史建筑街区','历史街区','1.5h','culture|history|photo','看本地建筑与街巷格局，注意参观礼仪'],
  ['城市公园','市中心','1h','nature|walk|kid','晨间或午后留白，节奏慢下来'],
  ['夜景广场','新城片区','1h','night|view|photo','收尾一晚，看灯光与人流']
];
var ZONES = [['north','华北 / 中原 · 四季分明'],['northeast','东北 · 冬长夏凉'],
  ['south','江南 / 华中 · 湿润多雨'],['coastal','沿海 · 海风与台风'],
  ['plateau','高原 · 昼夜温差大'],['tropical','热带 · 全年夏装'],['northwest','西北 · 干燥温差大']];
var ZONE_BUDGET = {north:[180,320,620],northeast:[190,330,640],south:[170,300,580],
  coastal:[200,350,680],plateau:[180,320,620],tropical:[210,360,720],northwest:[160,290,560]};

var S = null;
var PAGE = {view:'overview', q:'', prov:'全部', region:'全部', status:'全部',
  sort:'name', page:1, size:20, sel:{}, editId:null, draft:null};

function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function now(){return new Date().toLocaleString('zh-CN',{hour12:false});}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');
  clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2400);}
function $(id){return document.getElementById(id);}

function defaultState(){
  var provinces = (NAT.provinces||[]).map(function(p){return p.name;});
  var regions = (NAT.regions||META.regions||[]).slice();
  return {
    version:1, cities:clone(RAW), hidden:[], edited:{}, logs:[],
    dict:{provinces:provinces, regions:regions, zones:ZONES.map(function(z){return z[0];})},
    theme:clone((REPO_CFG.theme)||{}),
    seq:RAW.length
  };
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);
      if(o && Array.isArray(o.cities) && o.cities.length){ S=o; }
    }
  }catch(e){}
  if(!S)S=defaultState();
  S.hidden=S.hidden||[];S.edited=S.edited||{};S.logs=S.logs||[];
  S.dict=S.dict||defaultState().dict;S.theme=S.theme||{};S.seq=S.seq||S.cities.length;
}
function log(action,target,detail){
  S.logs.unshift({at:now(),action:action,target:target,detail:detail||''});
  if(S.logs.length>200)S.logs.length=200;
}
/* 后台状态 → 工作台同源草稿（刷新工作台即可看到编辑，无需先发布） */
function syncDraft(){
  try{
    var d={overrides:{},added:[],removed:S.hidden.slice()};
    Object.keys(S.edited).forEach(function(id){
      var c=S.cities.filter(function(x){return x.id===id;})[0];
      if(c)d.overrides[id]=c;
    });
    S.cities.filter(function(c){return c.isNew;}).forEach(function(c){d.added.push(c);});
    localStorage.setItem(DRAFT_KEY,JSON.stringify(d));
    var p={};try{p=JSON.parse(localStorage.getItem(PLAN_DRAFT_KEY)||'{}');}catch(e){p={};}
    p.theme=S.theme;localStorage.setItem(PLAN_DRAFT_KEY,JSON.stringify(p));
    var b=$('draftBadge');if(b){b.textContent='草稿已同步 · '+Object.keys(d.overrides).length+' 覆盖 / '+d.added.length+' 新增 / '+d.removed.length+' 隐藏';}
  }catch(e){console.warn('草稿同步失败',e);}
}
function saveAll(showMsg){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('✖ 本地存储写入失败：'+e.message);return;}
  syncDraft();
  /* 内嵌在 iframe.srcdoc 时把草稿回传父页，避免个别浏览器把 srcdoc 当成独立源 */
  try{if(window.parent!==window)parent.postMessage({type:'xj_draft',raw:localStorage.getItem(KEY)},'*');}catch(e){}
  if(showMsg)toast('✓ 已保存草稿；工作台刷新即可预览，发布后全站生效');
}
function find(id){for(var i=0;i<S.cities.length;i++)if(S.cities[i].id===id)return S.cities[i];return null;}
function cityStatus(c){
  if(S.hidden.indexOf(c.id)>=0)return ['已删除','danger'];
  if(c.isNew)return ['新增',''];
  if(c.baseline)return ['基线快照','gray'];
  return ['通用框架','warn'];
}
function regionOf(c){return c.region||'华东';}
function provinceOf(c){return c.prov||'—';}

/* ---------------- 菜单 / 路由 ---------------- */
function renderMenu(){
  $('menu').innerHTML=MENU.map(function(m){
    if(m[0]==='grp')return '<div class="grp">'+m[1]+'</div>';
    return '<button class="'+(PAGE.view===m[0]?'on':'')+'" onclick="go(\''+m[0]+'\')">'+m[1]+' <span>'+m[2]+'</span></button>';
  }).join('');
}
function go(v){
  if(v==='back'){location.href='index.html';return;}
  PAGE.view=v;PAGE.page=1;renderMenu();render();
}
function render(){
  var t={overview:['概览','数据总览'],cities:['城市管理','全国城市 · 增删改查'],
    dict:['分类字典','省份 / 大区 / 气候带'],theme:['全站视觉','主题 / 图标 / 背景'],
    publish:['导入 / 导出','发布闭环'],logs:['操作日志','最近 200 条']}[PAGE.view]||['概览',''];
  $('title').textContent=t[0];$('crumb').textContent=t[1];
  ({overview:vOverview,cities:vCities,ai:vAI,dict:vDict,theme:vTheme,publish:vPublish,logs:vLogs})[PAGE.view]();
  $('view').scrollTop=0;
}

/* ---------------- 概览 ---------------- */
function vOverview(){
  var gen=S.cities.filter(function(c){return !c.baseline&&!c.isNew;}).length;
  var base=S.cities.filter(function(c){return c.baseline;}).length;
  var added=S.cities.filter(function(c){return c.isNew;}).length;
  var dups=duplicateGroups().length;
  var spots=S.cities.reduce(function(a,c){return a+(c.spots?c.spots.length:0);},0);
  $('view').innerHTML=
   '<div class="note"><b>数据口径</b>：410 城全部内置且每城都有完整行程字段（12 落点 / 6 美食 / 3 住宿 / 4 交通）。'
   +'其中 <b>36 城基线</b>在工作台里使用 <code>data/cities.js</code> 的抓取快照与真实景点坐标；'
   +'其余 <b>374 城</b>是结构化通用行程框架：落点名为「这一类地方」、票价写「请核对」、坐标为示意点位，'
   +'<b>不编造</b>真实景点 / 票价 / 营业时间 / 实测经纬度 / 来源链接。真实内容请在「城市管理」逐城编辑或批量导入。</div>'
   +'<div class="stats">'
   +stat('全国城市',S.cities.length,'含基线 '+base+' / 通用 '+gen+' / 新增 '+added)
   +stat('省级行政区',(S.dict.provinces||[]).length,'大区 '+(S.dict.regions||[]).length+' 个')
   +stat('行程落点',spots,'每城 12 个通用落点')
   +stat('已删除',S.hidden.length,'软删除，可随时恢复')
   +stat('重复组',dups,'按归一化城市名检测')
   +stat('已编辑',Object.keys(S.edited).length,'草稿实时同步工作台')
   +'</div>'
   +'<div class="card"><h2>最近操作</h2><div class="logs">'+logRows(S.logs.slice(0,8))+'</div></div>'
   +'<div class="card"><h2>上线闭环</h2>'

    var st=cityStatus(c)[0];
    if(PAGE.prov!=='全部'&&provinceOf(c)!==PAGE.prov)return false;
    if(PAGE.region!=='全部'&&regionOf(c)!==PAGE.region)return false;
    if(PAGE.status!=='全部'){
      if(PAGE.status==='已删除'&&st!=='已删除')return false;
      if(PAGE.status==='基线快照'&&st!=='基线快照')return false;
      if(PAGE.status==='通用框架'&&st!=='通用框架')return false;
      if(PAGE.status==='新增'&&st!=='新增')return false;
    }
    if(q&&(c.name+c.prov+c.region+c.id+(c.tag||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var k=PAGE.sort;
  arr.sort(function(a,b){
    if(k==='spots')return (b.spots||[]).length-(a.spots||[]).length;
    if(k==='updated')return String(b.updated||'').localeCompare(String(a.updated||''));
    return String(a[k]||'').localeCompare(String(b[k]||''),'zh-CN');

/* ---------------- 增删改查 ---------------- */
/* 城市名归一化：去掉行政后缀，避免「阿勒泰 / 阿勒泰地区」「XX / XX市」
   被当成两座城。工作台按名字选目的地，省份是属性而不是身份。 */
function normCityName(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'')
    /* 不去「盟 / 旗」：内蒙古的「锡林郭勒盟」与「锡林郭勒」是事实层两个条目，
       去掉后缀会把它们误判成重复城，也会让重复组检测凭空多出 2 组。 */
    .replace(/(特别行政区|自治州|自治县|地区|市|县|区)$/,'');
}
function cityKey(c){return normCityName(c.name);}
function duplicateGroups(){
  var seen={},dups=[];
  S.cities.forEach(function(c){
    var k=cityKey(c);if(!k)return;
    if(seen[k])dups.push([seen[k],c]);else seen[k]=c;
  });
  return dups;
}
function lookupProv(name){
  var k=normCityName(name);if(!k)return '';
  for(var i=0;i<S.cities.length;i++)if(cityKey(S.cities[i])===k)return String(S.cities[i].prov||'').trim();
  var nat=(window.XJ_NATIONAL&&window.XJ_NATIONAL.cities)||[];
  for(var j=0;j<nat.length;j++)if(normCityName(nat[j].name)===k)return String(nat[j].prov||'').trim();
  return '';
}

function dedupe(){
  var groups=duplicateGroups();
  if(!groups.length){toast('✓ 当前没有重复城市');return;}
  if(!confirm('检测到 '+groups.length+' 组重复，将保留每组先出现的城，删除后出现的城（软删除，可恢复）。继续？'))return;
  groups.forEach(function(p){if(S.hidden.indexOf(p[1].id)<0)S.hidden.push(p[1].id);});
  log('去重',groups.length+' 组','保留先出现者');saveAll();vCities();toast('已去重 '+groups.length+' 组');
}
function deleteOne(id){
  var c=find(id);if(!c)return;
  if(!confirm('确定删除「'+c.name+'（'+c.prov+'）」？\n软删除，可在列表里恢复；发布后对所有访客生效。'))return;
  if(S.hidden.indexOf(id)<0)S.hidden.push(id);
  log('删除',c.name,c.prov);saveAll();vCities();toast('已删除 '+c.name);
}
function bulkDelete(){
  var ids=Object.keys(PAGE.sel).filter(function(id){return S.hidden.indexOf(id)<0;});
  if(!ids.length){toast('请先勾选未删除的城市');return;}
  if(!confirm('确定删除选中的 '+ids.length+' 座城市？可批量恢复。'))return;
  ids.forEach(function(id){S.hidden.push(id);});
  log('批量删除',ids.length+' 座','');PAGE.sel={};saveAll();vCities();toast('已删除 '+ids.length+' 座');
}
function restoreOne(id){S.hidden=S.hidden.filter(function(x){return x!==id;});
  log('恢复',find(id)?find(id).name:id,'');saveAll();vCities();toast('已恢复');}

  var ids=Object.keys(PAGE.sel);if(!ids.length){toast('请先勾选');return;}

function ef(k,v){

  if(k==='tags'){c.tags=String(v).split(/[,，、]+/).map(function(x){return x.trim();}).filter(Boolean);return;}

function validateCity(c,editId){
  if(!c.name||!String(c.name).trim())return '城市名必填';
  if(!c.prov||!String(c.prov).trim())return '省份必填';
  if(!c.region||!String(c.region).trim())return '大区必填';
  if(!/^[a-z0-9_-]{2,40}$/.test(String(c.id)))return 'ID 只能用小写字母 / 数字 / - _，2–40 位';
  for(var i=0;i<S.cities.length;i++){
    var x=S.cities[i];
    if(x.id===editId)continue;
    if(x.id===c.id)return 'ID「'+c.id+'」已存在';
    /* 归一化城市名 + 同省 才算重复；同名不同省是两座城。 */
    if(cityKey(x)===cityKey(c)&&String(x.prov).trim()===String(c.prov).trim())
      return '「'+c.name+'（'+c.prov+'）」已存在，请勿重复添加；要更新内容请到城市管理里编辑该城';
  }
  if(!Array.isArray(c.spots)||!c.spots.length)return '至少 1 个行程落点';
  for(var j=0;j<c.spots.length;j++)if(!c.spots[j][0])return '第 '+(j+1)+' 个落点缺名称';
  if(!Array.isArray(c.center)||c.center.length!==2||!isFinite(c.center[0])||!isFinite(c.center[1]))
    return '中心坐标必须是「纬度,经度」两个数字';
  return '';
}
function saveEdit(){
  var c=PAGE.draft,editId=PAGE.editId;
  c.name=String(c.name).trim();c.prov=String(c.prov).trim();c.region=String(c.region).trim();
  var err=validateCity(c,editId);
  if(err){toast('✖ '+err);return;}
  c.updated=now();c.confidence='edited';c.contentStatus='edited';
  if(editId){
    for(var i=0;i<S.cities.length;i++)if(S.cities[i].id===editId){S.cities[i]=clone(c);break;}
    S.edited[editId]=1;log('编辑',c.name,c.prov+' · '+(c.spots||[]).length+' 落点');
  }else{
    /* 只填名字就得到完整行程：把默认模板里的「新城」占位换成真实城市名，
       不覆盖用户在表单里手工改过的字段（只替换占位串）。 */
    var nm=String(c.name);
    ['spots','food','stay'].forEach(function(k){
      c[k]=(c[k]||[]).map(function(row){var a=row.slice();a[0]=String(a[0]).replace(/新城/g,nm);return a;});
    });
    c.transport=(c.transport||[]).map(function(s){return String(s).replace(/新城/g,nm);});
    c.intro=String(c.intro||'').replace(/新城/g,nm);
    c.tag='后台新增 · 完整通用行程';
    c.isNew=true;S.cities.push(clone(c));S.seq++;S.edited[c.id]=1;
    log('新增',c.name,c.prov+' · '+(c.spots||[]).length+' 落点');
  }
  saveAll();closeDrawer();vCities();toast('✓ 已保存「'+c.name+'」，工作台刷新即可预览');
}

function dictAdd(key){var el=$('new_'+key);var v=(el.value||'').trim();if(!v){toast('请输入名称');return;}
  if((S.dict[key]||[]).indexOf(v)>=0){toast('已存在');return;}

function dictRename(key,i,v){var old=S.dict[key][i];v=String(v).trim();if(!v||v===old)return;
  if(key==='provinces')S.cities.forEach(function(c){if(c.prov===old)c.prov=v;});
  if(key==='regions')S.cities.forEach(function(c){if(c.region===old)c.region=v;});
  S.dict[key][i]=v;log('字典改名',key,old+' → '+v);saveAll();vDict();toast('已改名');}
function dictDel(key,i){var v=S.dict[key][i];
  var used=S.cities.filter(function(c){return (key==='provinces'&&c.prov===v)||(key==='regions'&&c.region===v)||(key==='zones'&&c.climateZone===v);}).length;
  if(used&&!confirm('还有 '+used+' 座城市在使用「'+v+'」，仍要删除字典项吗？'))return;
  S.dict[key].splice(i,1);log('字典删除',key,v);saveAll();vDict();toast('已删除');}

function parseImport(text){
  var t=text.trim();if(!t)return {ok:false,msg:'内容为空',cities:[]};
  if(t.charAt(0)==='['||t.charAt(0)==='{'){
    var j;try{j=JSON.parse(t);}catch(e){return {ok:false,msg:'JSON 解析失败：'+e.message,cities:[]};}
    var arr=Array.isArray(j)?j:(j.cities||j.extended||[]);
    if(!Array.isArray(arr))return {ok:false,msg:'没找到城市数组',cities:[]};
    return {ok:true,cities:arr,msg:''};
  }
  var lines=t.split(/\r?\n/),out=[];
  lines.forEach(function(line,i){
    var p=line.split(/[,，\t]/).map(function(x){return x.trim();});
    if(p.length<2||!p[0])return;
    var c=blankCity();
    c.id='imp_'+Date.now().toString(36)+'_'+i;
    c.name=p[0];c.prov=p[1];c.region=p[2]||(S.dict.regions||['华东'])[0];
    c.tag='批量导入 · 通用框架';
    c.spots=templateSpots(c.name);
    c.food=[['本地风味小馆','点两道本地做法的家常菜','老城 / 本地小馆','请核对'],
      ['街边早点','出炉即食的那几样','早市 / 老街','请核对']];
    c.stay=[[c.name+'老城 / 历史街区','景点与老店步行可达','请核对','首次到访']];
    c.transport=['🚄 抵达：'+c.name+'站，班次出行前核对','☀️ 门票与营业状态请核对'];
    c.intro='把'+c.name+'排成 3 天，不赶路；本页为通用建议框架，出行前请核对开放信息。';
    out.push(c);
  });
  return {ok:true,cities:out,msg:''};
}
function doImport(){
  var p=parseImport($('impText').value);
  var out=$('impMsg');
  if(!p.ok){out.textContent='✖ '+p.msg;toast('✖ '+p.msg);return;}
  if(!p.cities.length){out.textContent='✖ 没有可导入的城市';return;}
  if($('impMode').value==='replace'){
    if(!confirm('整体替换会清空当前 '+S.cities.length+' 座城市，确定？'))return;
    S.cities=[];S.hidden=[];S.edited={};
  }
  var ok=0,fail=[];
  p.cities.forEach(function(raw,i){
    var c=clone(raw);
    if(!c.id)c.id='imp_'+Date.now().toString(36)+'_'+i;
    if(!c.spots||!c.spots.length)c.spots=templateSpots(c.name||'新城');
    if(!c.food)c.food=[];if(!c.stay)c.stay=[];if(!c.transport)c.transport=[];
    if(!c.g)c.g=['#3f6f63','#8fb3a1'];if(!c.a)c.a=c.g[0];
    if(!c.center||!isFinite(c.center[0]))c.center=[34.0,108.0];
    if(!c.climateZone)c.climateZone='north';
    if(!c.budget)c.budget=[180,320,620];
    c.isNew=true;c.updated=now();c.confidence='imported';c.contentStatus='imported';
    var err=validateCity(c,null);
    if(err){fail.push('第 '+(i+1)+' 条：'+err);return;}
    var exist=null;
    for(var k=0;k<S.cities.length;k++)if(S.cities[k].name===c.name&&S.cities[k].prov===c.prov){exist=S.cities[k];break;}
    if(exist){var keepId=exist.id;S.cities[k]=Object.assign({},exist,c,{id:keepId});S.edited[keepId]=1;}
    else{S.cities.push(c);S.edited[c.id]=1;}
    ok++;
  });
  log('导入',ok+' 座',fail.length?'失败 '+fail.length+' 条':'');saveAll();
  out.innerHTML='✅ 成功 <b>'+ok+'</b> 座'+(fail.length?'，跳过 '+fail.length+' 条：'+esc(fail.slice(0,3).join('；')):'');
  toast('导入完成：成功 '+ok+' 座');vPublish();
}
function runCheck(){
  var errs=[],warns=[];
  var ids={},keys={};
  S.cities.forEach(function(c,i){
    if(!c.name)errs.push('#'+i+' 缺名称');
    if(!c.prov)errs.push('#'+i+' 缺省份');
    if(!/^[a-z0-9_-]{2,40}$/.test(String(c.id||'')))errs.push('#'+i+' id 非法：'+c.id);
    if(ids[c.id])errs.push('id 重复：'+c.id);ids[c.id]=1;
    var k=c.name+'|'+c.prov;if(keys[k])errs.push('重复城市：'+k);keys[k]=1;
    if(!Array.isArray(c.spots)||c.spots.length<3)errs.push(c.name+' 落点不足 3 个');
    if(!Array.isArray(c.food)||!c.food.length)errs.push(c.name+' 没有美食');
    if(!Array.isArray(c.stay)||!c.stay.length)errs.push(c.name+' 没有住宿区');
    if(!Array.isArray(c.transport)||!c.transport.length)errs.push(c.name+' 没有交通提示');
    if(!Array.isArray(c.center)||c.center.length!==2)errs.push(c.name+' 中心坐标无效');
    if(!c.baseline&&c.spots.some(function(s){return !/请核对|核对|按人均|免费|面议|按项目/.test(String(s[3]));}))
      warns.push(c.name+' 含具体票价，请确认已核对来源');
  });
  S.hidden.forEach(function(id){if(!find(id))errs.push('隐藏列表里有不存在的 id：'+id);});
  var html='<div class="note'+(errs.length?' warn':'')+'"><b>自检结果</b>：'
   +(errs.length?'发现 '+errs.length+' 项错误':'结构校验全部通过')+' · '+warns.length+' 条提醒 · 共 '+S.cities.length+' 城</div>';
  if(errs.length)html+='<div style="color:var(--danger);font-size:12px;max-height:200px;overflow:auto">'+errs.slice(0,30).map(esc).join('<br>')+'</div>';
  if(warns.length)html+='<div style="color:var(--warn);font-size:12px;margin-top:8px;max-height:120px;overflow:auto">'+warns.slice(0,20).map(esc).join('<br>')+'</div>';
  $('checkOut').innerHTML=html;
  log('自检',errs.length?errs.length+' 项错误':'通过','');saveAll();
  toast(errs.length?'自检发现 '+errs.length+' 项错误':'✓ 自检通过');
}

/* ---------------- AI 采编 ---------------- */
/* 多源公开检索 → 交给模型整合 → 严格 JSON → 校验补齐 → 一键入库。
   Token 只存本机；检索或接口不可达都明确提示，不静默假装成功。 */
var AI={cfg:null,result:null,resultKind:null,wikiText:'',wikiSource:'',wikiFail:'',

  modelsPath:'/models',prefer:['qwen','glm','deepseek'],

function aiCfg(){
  if(AI.cfg)return AI.cfg;

  var d={provider:0,base:AI_CFG.providers[0].base,model:'',token:'',

/* 统一算 base：本机桥模式忽略用户填的 base，避免直连地址残留 */
function aiBase(c){

                           : String(c.base||AI_CFG.providers[0].base).replace(/\/$/,'');

/* 下拉与「手动填模型 ID」写同一个字段，选/填任一边都同步另一边，避免显示打架 */

  if(k==='provider'||k==='base'||k==='mode'){AI.modelList=null;AI.modelsVerified=false;AI.conn='';}

}

/* 只取错误里的可读部分：HTTP 码 + message 字段，不把 request_id / raw JSON 贴回页面 */
function aiBrief(m){
  var s=String(m||''),cut=s.indexOf('{');
  var head=(cut>=0?s.slice(0,cut):s).trim();
  var mm=s.match(/"message"\s*:\s*"([^"]{0,90})/);
  return (head||'HTTP')+(mm?' · '+mm[1]:'');
}
/* 把上游的原始错误翻译成人话 + 可操作下一步 */
function aiHumanError(e){
  var m=String((e&&e.message)||e||''),code=(m.match(/HTTP\s*(\d{3})/)||[])[1]||'';
  /* 超时必须最先判，避免把「模型没算完」误报成网络不可达。 */
  if(/AI_TIMEOUT/i.test(m)){
    var sec=(m.match(/AI_TIMEOUT\s*(\d+)/)||[])[1];
    var what=(m.match(/AI_TIMEOUT\s+\d+\s+(.+)$/)||[])[1]||'';
    var wait=sec?'（等待 '+(+sec/1000).toFixed(1)+' 秒）':'';
    var T={
      '模型列表':'模型列表拉取超时'+wait+'：GET /models 没在 modelsTimeoutMs 内返回。'
        +'点「↻ 刷新可用模型」重试，或调大 config.js 的 modelsTimeoutMs；接口没实现 /models 时可在「手动填模型 ID」直接填一个。',
      '最小推理':'连接测试的最小推理超时'+wait+'：模型连一句「可用」都没回。'
        +'换一个更小/更快的模型，或调大 pingTimeoutMs；这不代表生成也会被卡住。',
      '多源检索':'公开检索超时'+wait+'：已自动降级为模型自带知识，不阻断生成，结果会标注需人工核对。'
        +'可调大 wikiTimeoutMs 或取消勾选「检索公开资料」。',
      '完整生成':'生成超时'+wait+'：模型还没返回完整城市 JSON 就被中断。'
        +'这不是网络或 CORS 问题，切「本机桥」不解决。可把 config.js 的 genTimeoutMs 调大、'
        +'取消勾选「检索公开资料」减少输入、或换一个更快的模型重试。'
    };
    return T[what]||('请求超时'+wait+'（'+what+'）：调大 config.js 里对应的 *TimeoutMs 后重试，切本机桥不解决超时。');
  }
  if(/has no provider supported|no provider|model.*not.*found|model id/i.test(m))
    return '模型 ID 不在当前服务列表。点「🔌 连接测试」或「↻ 刷新可用模型」'
      +'从接口重新拉取当前可用模型；也可以在「手动填模型 ID」里填一个。接口说：'+aiBrief(m);
  if(code==='401'||code==='403')
    return 'Token 无效或账号未授权（HTTP '+code+'）。到 '+(AI_CFG.providers[aiCfg().provider]||{}).tokenUrl
      +' 重新生成 Access Token，并确认已绑定阿里云账号、完成实名认证。';
  if(code==='429')return '调用过于频繁（HTTP 429），稍等几秒再试。';
  if(code==='400')
    return '接口返回 400，最常见是模型 ID 不被支持。点「🔌 连接测试」从接口拉取当前可用模型。接口说：'+aiBrief(m);
  if(/AbortError|signal is aborted|The user aborted a request|aborted/i.test(m))
    return '请求被中断（AbortError），通常是生成时间超过上限。若「🔌 连接测试」显示正常，'
      +'优先调大 config.js 的 genTimeoutMs 或换更快的模型；不要先去切本机桥。';
  if(/Failed to fetch|NetworkError|TypeError|Load failed/i.test(m))
    return '网络不可达或被浏览器 CORS 拦截（fetch 未发出）。若「🔌 连接测试」是绿的，'
      +'说明 Token 与模型端点通，先确认这次是不是超时；确属 CORS 时把「连接方式」切到「本机桥」，'
      +'运行 python3 tools/ai_bridge.py 后重试。';
  return '调用失败：'+m.slice(0,180);
}
/* GET /models：拉当前真实可用模型，按 prefer 关键词排序（不含任何具体 ID），自动替换下拉 */
async function aiFetchModels(){
  var c=aiCfg();
  if(!c.token)throw new Error('HTTP 401 请先填写 API Token');
  var url=aiBase(c)+(AI_CFG.modelsPath||'/models');
  var ms=AI_CFG.modelsTimeoutMs||12000,tm=aiTimeout(ms);
  try{
    var mh={'Authorization':'Bearer '+c.token};
    if(c.mode==='bridge')mh['X-Target-Base']=String(c.base||AI_CFG.providers[0].base);
    var r=await fetch(url,{signal:tm.signal,headers:mh});
    if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));
    var j=await r.json();
    var ids=(j.data||j.models||[]).map(function(x){return typeof x==='string'?x:(x.id||x.name);})
      .filter(function(x){return !!x;});
    if(!ids.length)throw new Error('模型列表为空，接口可能不是 OpenAI 兼容格式');
    var pref=AI_CFG.prefer||['qwen'];
    function rank(x){var l=x.toLowerCase();for(var i=0;i<pref.length;i++)if(l.indexOf(pref[i])>=0)return i;return 99;}
    ids.sort(function(a,b){return rank(a)-rank(b)||a.localeCompare(b);});
    AI.modelList=ids.map(function(id){return {id:id,label:id};});
    AI.modelsVerified=true;
    if(ids.indexOf(c.model)<0){c.model=ids[0];aiSave();}
    return ids;
  }catch(e){throw aiWrapTimeout(e,tm,ms,'模型列表');}
  finally{tm.done();}
}
/* 一次极小的推理请求，确认 Token + 模型 + 链路真的可用（不是只查列表） */
async function aiPing(){
  var c=aiCfg(),ms=AI_CFG.pingTimeoutMs||20000,tm=aiTimeout(ms);
  try{
    var ph={'Content-Type':'application/json','Authorization':'Bearer '+c.token};
    if(c.mode==='bridge')ph['X-Target-Base']=String(c.base||AI_CFG.providers[0].base);
    var r=await fetch(aiBase(c)+'/chat/completions',{method:'POST',signal:tm.signal,headers:ph,
      body:JSON.stringify({model:c.model,temperature:0,stream:false,max_tokens:16,
        messages:[{role:'user',content:'只回复两个字：可用'}]})});
    if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));
    var j=await r.json();
    if(!j.choices||!j.choices[0]||!j.choices[0].message)throw new Error('响应不是 OpenAI 兼容格式');
    return String(j.choices[0].message.content||'').trim();
  }catch(e){throw aiWrapTimeout(e,tm,ms,'最小推理');}
  finally{tm.done();}
}
async function aiRefreshModels(){
  if(AI.busy)return;
  AI.busy=true;aiStatus('正在拉取当前可用模型列表…');
  try{

      +'、最小推理返回「'+raw.slice(0,20)+'」（'+dt+'s）。现在可以点「🔍 检索资料并生成」。','ok');

function aiTimeout(ms){
  var ctl=new AbortController(),hit=false;
  var t=setTimeout(function(){hit=true;ctl.abort();},ms);
  return {signal:ctl.signal,timedOut:function(){return hit;},
          done:function(){clearTimeout(t);}};
}
/* 把「本函数自己触发的超时」翻译成可识别错误，不让 aiHumanError 猜 */
function aiWrapTimeout(e,tm,ms,what){
  if(tm&&tm.timedOut())return new Error('AI_TIMEOUT '+ms+' '+(what||''));
  return e;
}
/* 检索源按顺序尝试：任一成功即停并如实记录源名，全部失败才抛错让上层降级。
   不把「已降级」写成「已检索」，也不拿模型自带知识冒充公开资料。 */
async function aiWiki(name){
  var c=aiCfg();
  var srcs=(c.mode==='bridge')
    ? [{name:'本机桥',kind:'bridge',base:AI_CFG.bridge.replace(/\/$/,'')}]
    : (Array.isArray(AI_CFG.wikiSources)&&AI_CFG.wikiSources.length
       ? AI_CFG.wikiSources.slice()
       : [{name:'维基百科',kind:'mediawiki',base:AI_CFG.wiki}]);
  /* 兼容只改 wiki 单个地址的旧配置 / 测试注入：替换第一源地址，不让多源列表把它盖掉 */
  if(c.mode!=='bridge'&&AI_CFG.wiki&&srcs.length&&String(AI_CFG.wiki)!==String(srcs[0].base)){
    srcs[0]={name:srcs[0].name+'（自定义地址）',kind:srcs[0].kind,base:AI_CFG.wiki};
  }
  var fails=[];
  for(var i=0;i<srcs.length;i++){
    var src=srcs[i],u='',ms=AI_CFG.wikiTimeoutMs||8000,tm=aiTimeout(ms);
    if(src.kind==='bridge')u=src.base+'/wiki?name='+encodeURIComponent(name);
    else if(src.kind==='rest')u=src.base+encodeURIComponent(name);
    else u=src.base+'?action=query&prop=extracts&exintro=1&explaintext=1&format=json&origin=*&titles='
             +encodeURIComponent(name);
    try{
      var r=await fetch(u,{signal:tm.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      var j=await r.json(),pages=(j.query&&j.query.pages)||{},k=Object.keys(pages)[0];
      var text=(pages[k]&&pages[k].extract)||j.extract||j.summary||'';
      if(String(text).length<10)throw new Error('摘要为空');
      AI.wikiSource=String(src.name);
      return {text:String(text),source:String(src.name),tries:i+1};
    }catch(e){
      fails.push(src.name+'：'+aiBrief(String((e&&e.message)||e)).slice(0,60));
    }finally{tm.done();}
  }
  AI.wikiSource='';AI.wikiFail='全部 '+srcs.length+' 个检索源不可用（'+fails.join(' / ')+'）';
  throw new Error(AI.wikiFail);
}

async function aiCall(c,wiki,brief){
  var url=aiBase(c)+'/chat/completions';
  /* 完整生成要吐一整份城市 JSON，单独给 2 分钟 */
  var ms=AI_CFG.genTimeoutMs||120000,tm=aiTimeout(ms),t0=Date.now();
  try{
    var ch={'Content-Type':'application/json','Authorization':'Bearer '+c.token};
    if(c.mode==='bridge')ch['X-Target-Base']=String(c.base||AI_CFG.providers[0].base);
    var body={model:c.model,temperature:AI_CFG.temperature||0.3,stream:false,
      messages:[{role:'system',content:'你是中文旅行行程数据编辑。只输出一个严格 JSON 对象，不要任何解释、不要 markdown 代码块、不要前后缀文字。'},
                {role:'user',content:brief?aiPromptBrief(c,wiki):aiPrompt(c,wiki)}]};
    if(brief)body.max_tokens=AI_CFG.briefMaxTokens||1200;
    var r=await fetch(url,{method:'POST',signal:tm.signal,headers:ch,body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));
    var j=await r.json();
    if(!j.choices||!j.choices[0]||!j.choices[0].message)throw new Error('响应不是 OpenAI 兼容格式');
    return j.choices[0].message.content;
  }catch(e){
    var w=aiWrapTimeout(e,tm,ms,'完整生成');
    /* 诊断只留错误类型与 HTTP 码，不把整段响应体（含 request_id 的 raw JSON）又贴回页面 */
    var em=String((e&&e.message)||e||''),cut=em.indexOf('{');
    var brief=(cut>=0?em.slice(0,cut):em.slice(0,60)).trim()||'（无消息）';
    AI.lastGen={ms:Date.now()-t0,limit:ms,url:url,model:c.model,
      err:((e&&e.name)?e.name+': ':'')+brief,timeout:tm.timedOut()};
    throw w;
  }finally{tm.done();}
}
function aiParse(raw){
  var t=String(raw||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  var a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('响应里找不到 JSON 对象');
  return JSON.parse(t.slice(a,b+1));
}
function aiRows(arr,n,cols,fill){
  arr=Array.isArray(arr)?arr.slice(0,n):[];
  while(arr.length<n)arr.push(fill[arr.length%fill.length].slice());
  return arr.map(function(r){
    var row=Array.isArray(r)?r.slice():[String(r)];
    while(row.length<cols)row.push('');
    return row.slice(0,cols);
  });
}
function aiId(name){
  var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
  return 'ai_'+h.toString(36)+'_'+Date.now().toString(36).slice(-4);
}
function aiNormalize(o,c,wiki){
  var tmpl=applyTemplate(blankCity(),String(c.name).trim());
  var keys=['id','name','prov','region','en','emoji','g','a','image','tag','seasons','days','climate',
            'climateZone','climateZoneLabel','budget','center','intro','tags','spots','food','stay','transport',
            'level','tier','source','note'];
  var r={};keys.forEach(function(k){r[k]=(o&&o[k]!==undefined&&o[k]!==null)?o[k]:tmpl[k];});
   r.name=String(c.name).trim();
   /* 省份是行政区划事实：按城市名查内置索引，不让模型编、也不吃旧配置默认值 */
   var autoProv=lookupProv(r.name);
   r.prov=String(autoProv||c.prov||r.prov||'').trim();
  if(!r.region)r.region=provinceOf(r.prov)||'华东';
  if(!Array.isArray(r.g)||r.g.length<2)r.g=['#3f6f63','#8fb3a1'];
  if(!Array.isArray(r.tags))r.tags=[];
  if(!Array.isArray(r.budget)||r.budget.length<3)r.budget=[180,320,620];
  if(!Array.isArray(r.center)||r.center.length!==2)r.center=[34.0,108.0];
  r.spots=aiRows(r.spots,12,6,templateSpots(r.name));
  r.food=aiRows(r.food,6,4,tmpl.food);
  r.stay=aiRows(r.stay,3,4,tmpl.stay);
  r.transport=(Array.isArray(r.transport)?r.transport.map(String):[]).slice(0,4);
  while(r.transport.length<4)r.transport.push(tmpl.transport[r.transport.length]);
   /* 用户在结果 JSON 里改的 id 要生效；没填 / 不合法才重新生成 */
   if(!/^[a-z0-9_-]{2,40}$/.test(String(r.id||'')))r.id=aiId(r.name+'|'+r.prov);
  r.tag='AI 采编 · 待核对';
  r.baseline=false;r.isNew=true;
  r.contentStatus='ai_generated';r.confidence='ai';
  r.source=(wiki?((AI.wikiSource||'公开检索源')+' 摘要 + '):'')
          +'模型 '+aiCfg().model+' 生成，需人工核对';
  r.note='由 AI 依据公开资料与模型知识生成；票价 / 营业时间 / 预约状态为「请核对」，不是实测数据，出行前请核实并在后台替换为真实内容';
  r.updated=now();
  return r;
}
/* 本地通用框架：AI 完全不可用时的显式兜底。
   必须用户点按钮才生成，且 tag / source / contentStatus 全部写明「不是 AI 采编」，
   否则批量补齐会把它当 AI 升级覆盖现有城。 */
function aiLocalMeta(r){
  r.tag='本地框架 · 待补资料';
  r.contentStatus='local_framework';r.confidence='generated';
  r.source='本地通用框架（未调用模型、未检索到公开资料）';
  r.note='这不是 AI 采编结果：'+String(r.note||'')+'。所有落点带【通用建议】，不是真实景点；'
        +'票价、营业、预约均需出行前核对或在后台逐城替换。';
  return r;
}
function aiLocalNormalize(o){
  return aiLocalMeta(aiNormalize(o,aiCfg(),''));
}
/* 用户在结果 JSON 里改的每一个字符都要留下来：切模块 / 重绘 / 生成失败后回到这一页，
   不能拿 AI.result 把未保存的编辑覆盖掉。编辑中途 JSON 不合法时不回写。 */
function aiJsonEdit(v){
  try{var o=JSON.parse(v);if(o&&typeof o==='object'&&!Array.isArray(o))AI.result=o;}
  catch(e){/* 正在输入，暂不覆盖 */}
}
function aiLocalFallback(){
  var c=aiCfg();
  if(!c.name||!String(c.name).trim()){aiStatus('请先填城市名','err');return;}
  var r=aiLocalMeta(aiNormalize(applyTemplate(blankCity(),String(c.name).trim()),c,''));
  AI.result=r;AI.resultKind='local';AI.retryBrief=false;AI.wikiText='';AI.wikiSource='';
  var box=document.getElementById('aiJson');if(box)box.value=JSON.stringify(r,null,2);
  aiStatus('已生成「'+r.name+'」的本地通用框架：'+r.spots.length+' 落点 / '+r.food.length
    +' 美食 / '+r.stay.length+' 住宿 / '+r.transport.length+' 交通。'
    +'⚠ 这不是 AI 采编，全部是带【通用建议】的通用场景，不是真实景点。'
    +'可改下方 JSON 后点「一键添加」；确认网络与模型后也可重试 AI 生成。','warn');
}
async function aiGenerate(){
  if(AI.busy)return;
  var c=aiCfg();
  if(!c.name||!String(c.name).trim()){aiStatus('请先填城市名','err');return;}
  if(!c.token){aiStatus('请先填 API Token（魔塔免费获取：'+(AI_CFG.providers[c.provider]||{}).tokenUrl+'）','err');return;}
  if(!c.model){aiStatus('还没有模型：请先点「↻ 刷新可用模型」从接口拉取，或在「手动填模型 ID」里填一个。','err');return;}
  AI.busy=true;AI.result=null;AI.resultKind=null;AI.wikiText='';AI.wikiSource='';
  AI.retryBrief=false;AI.lastGen=null;AI.lastFail=null;AI.wikiFail='';
  /* 清掉上一次的预览：失败时状态说「结果未生成」，下面还留着旧 JSON 会自相矛盾，
     用户还可能把上一次的结果误点「一键添加」 */
  var oldBox=document.getElementById('aiJson');if(oldBox)oldBox.value='';
  var wiki='',wikiSrc='',wikiLine='① 已跳过检索（按你的设置使用模型自带知识）';
  if(c.wikiOn){
    aiStatus('① 正在按顺序尝试公开检索源…');
    try{
      var w=await aiWiki(c.name);wiki=w.text;wikiSrc=w.source;
      wikiLine='① 命中「'+w.source+'」（第 '+w.tries+' 个源）· 摘要 '+wiki.length+' 字';
    }catch(e){wiki='';AI.wikiFail=String((e&&e.message)||e||'检索源不可用');
      wikiLine='① '+AI.wikiFail+'，改用模型自带知识，结果会标注需人工核对';}
    AI.wikiText=wiki;
    aiStatus(wikiLine+'，正在交给模型整合…','warn');
  }else{aiStatus(wikiLine,'warn');}
  var genSec=Math.round((AI_CFG.genTimeoutMs||120000)/1000);
  aiStatus('② 正在调用 '+c.model+' 生成整份城市 JSON（最长等待 '+genSec+' 秒）…');
  var raw=null,firstErr=null,firstGen=null;
  try{raw=await aiCall(c,wiki);}
  catch(e){
    firstErr=e;firstGen=AI.lastGen||{};
    /* 只有「超时」才自动精简重试：401 / 400 / CORS 重试没有意义，别白等一轮 */
    if(/AI_TIMEOUT/.test(String((e&&e.message)||e||''))){
      aiStatus('② 完整生成超时，正在用「精简提示」自动重试一次（只要 6 落点 / 3 美食，输出更短）…','warn');
      try{raw=await aiCall(c,wiki,true);AI.retryBrief=true;}
      catch(e2){firstErr=e2;raw=null;}
    }
  }
  if(raw===null){
    AI.busy=false;AI.conn='✖ 生成调用失败';
    var g=firstGen||{},diag='';
    AI.lastFail={at:new Date().toISOString(),stage:'generate',human:aiHumanError(firstErr),
      wiki:wiki?(wikiSrc+' · ok '+wiki.length+' 字'):(AI.wikiFail||'未取到/已跳过'),
      gen:g,retriedBrief:AI.retryBrief};
    if(g.ms!=null)diag='【实测】耗时 '+(g.ms/1000).toFixed(1)+'s / 上限 '+(g.limit/1000).toFixed(1)
      +'s · 模型 '+String(g.model||'')+' · 端点 '+String(g.url||'').slice(0,70)
      +' · 原始错误 '+String(g.err||'');
    var wshort=wiki?(wikiSrc+' 摘要 '+wiki.length+' 字'):'检索未取到，已降级为模型自带知识';
    var extra=AI.retryBrief?' ｜ 已用精简提示重试一次，仍失败':'';
    /* 失败绝不在结果 JSON 里塞假数据；给显式出口，用户自己选 */
    var failBox=document.getElementById('aiJson');if(failBox)failBox.value='';
    aiStatus(aiHumanError(firstErr)+(diag?' ｜ '+diag:'')+extra+' ｜ '+wshort
      +'。下方结果未生成，不会用本地框架冒充 AI 采编。','err',
      '<button class="btn sm pri" onclick="aiLocalFallback()">📄 改用本地框架（离线可用）</button>'
      +'<button class="btn sm" onclick="aiGenerate()">↻ 重试 AI 生成</button>'
      +'<button class="btn sm ghost" onclick="aiExportStatus()">↓ 导出诊断</button>');
    return;
  }
  aiStatus('③ 正在解析并校验字段…');
  var obj;
  try{obj=aiParse(raw);}
  catch(e){
    AI.busy=false;AI.result=null;AI.resultKind=null;
    var badBox=document.getElementById('aiJson');if(badBox)badBox.value='';
    aiStatus('模型没返回可解析的 JSON：'+e.message+'。建议点「🔌 连接测试」换一个当前可用的中文模型。'
      +'下方结果未生成，不会用本地框架冒充 AI 采编。','err',
      '<button class="btn sm pri" onclick="aiLocalFallback()">📄 改用本地框架（离线可用）</button>'
      +'<button class="btn sm" onclick="aiGenerate()">↻ 重试 AI 生成</button>');return;}
  AI.result=aiNormalize(obj,c,wiki);AI.resultKind='ai';
  var box=document.getElementById('aiJson');if(box)box.value=JSON.stringify(AI.result,null,2);
  AI.busy=false;
  var extraNote=AI.retryBrief?'（完整生成超时后由精简提示重试成功；模型少给的落点由【通用建议】模板补齐）'
                             :'';
  var srcNote=wikiSrc?('检索源：'+wikiSrc+'。')
      :(c.wikiOn?((AI.wikiFail||'检索源全部不可用')+'，本次改用模型自带知识，结果需人工核对。')
                :'已跳过检索，用模型自带知识。');
  aiStatus('已生成「'+AI.result.name+'」：'+AI.result.spots.length+' 落点 / '+AI.result.food.length
    +' 美食 / '+AI.result.stay.length+' 住宿 / '+AI.result.transport.length+' 交通。'
    +srcNote+extraNote+'可改下方 JSON 后点「一键添加」。','ok');
}
/* 日志里如实写来源：本地框架不能记成「模型 xxx 生成」 */
function aiVia(){
  return AI.resultKind==='local'?'本地通用框架（未调用模型）':('模型 '+aiCfg().model);
}
/* 写入一条 AI 结果：同名城一律「覆盖升级」而不是再插一条。
   保留原 id，才能命中工作台覆盖层 / 隐藏层，也避免截图里两个「阿勒泰」。 */
function aiWrite(c,quiet){
  var dup=null,di=-1;
  for(var i=0;i<S.cities.length;i++)if(cityKey(S.cities[i])===cityKey(c)
     &&String(S.cities[i].prov).trim()===String(c.prov).trim()){dup=S.cities[i];di=i;break;}
  if(dup){
    if(dup.baseline&&!quiet){
      var ok=confirm('「'+dup.name+'」是基线真实快照，覆盖会替换它的真实景点数据。\n'
        +'确定要用 AI 采编结果覆盖吗？（可取消后到城市管理里编辑）');
      if(!ok)return {ok:false,msg:'已取消覆盖基线城'};
    }
    var keepId=dup.id,keepBaseline=!!dup.baseline;
    var nc=clone(c);nc.id=keepId;nc.baseline=keepBaseline;nc.isNew=false;
    S.cities[di]=nc;
    S.edited[keepId]=1;S.seq++;
    log('AI 覆盖升级',nc.name,nc.prov+' · '+nc.spots.length+' 落点 · '+aiVia());
    saveAll();
    if(!quiet){go('cities');openView(keepId);toast('✓ 已用 AI 结果升级「'+nc.name+'」，没有新增重复城');}
    return {ok:true,mode:'updated',name:nc.name};
  }
  var err=validateCity(c,null);
  if(err)return {ok:false,msg:'校验未通过：'+err};
  S.cities.push(clone(c));S.seq++;S.edited[c.id]=1;
  log('AI 新增',c.name,c.prov+' · '+c.spots.length+' 落点 · '+aiVia());
  saveAll();
  if(!quiet){go('cities');openView(c.id);toast('✓ 已把「'+c.name+'」添加到城市库');}
  return {ok:true,mode:'created',name:c.name};
}
/* 诊断状态：对齐参考项目的 *_STATUS.json —— 刷新前的现场可一键导出，不丢证据 */
function aiExportStatus(){
  var c=aiCfg();
  var o={
    schema:'xingji-ai-status/1',at:new Date().toISOString(),
    provider:String(c.provider||''),base:String(c.base||''),
    mode:String(c.mode||''),model:String(c.model||''),
    token:'***'+(String(c.token||'').slice(-4)||'(空)'),
    verified:AI.modelsVerified,modelIds:(AI.modelList||[]).map(function(x){return x.id;}),
    timeouts:{models:AI_CFG.modelsTimeoutMs,ping:AI_CFG.pingTimeoutMs,
             wiki:AI_CFG.wikiTimeoutMs,gen:AI_CFG.genTimeoutMs},
    wikiOn:!!c.wikiOn,wikiSources:(AI_CFG.wikiSources||[]).map(function(x){return x.name;}),
    wikiSourceHit:AI.wikiSource||'',conn:AI.conn||'',lastFail:AI.lastFail||null,
    resultKind:AI.resultKind||null,retriedBrief:!!AI.retryBrief,
    result:AI.result?{name:AI.result.name,spots:AI.result.spots.length,
                      food:AI.result.food.length,stay:AI.result.stay.length,
                      tag:AI.result.tag,source:AI.result.source,
                      contentStatus:AI.result.contentStatus}:null
  };
  var b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='AI_STATUS.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
  aiStatus('已导出 AI_STATUS.json（Token 仅保留后 4 位）。把这个文件发回即可定位，不用手抄红字。','ok');
}
function aiApply(){
  if(!AI.result){aiStatus('请先点「检索资料并生成」，或点「📄 本地框架」离线生成一份可编辑草稿','err');return;}
  var c=AI.result,box=document.getElementById('aiJson');
  if(box&&box.value.trim()){
    try{
      var o=JSON.parse(box.value);
      /* 本地框架走自己的归一化，保留「不是 AI 采编」的全部标注 */
      c=(AI.resultKind==='local')?aiLocalNormalize(o):aiNormalize(o,aiCfg(),AI.wikiText);
    }
    catch(e){aiStatus('预览 JSON 不是合法对象：'+e.message,'err');return;}
  }
  /* 一键添加必须显式拒绝重复，不能悄悄走「覆盖升级」——覆盖是批量补齐的能力。 */
  var exist=null;
  for(var i=0;i<S.cities.length;i++)if(cityKey(S.cities[i])===cityKey(c)
     &&String(S.cities[i].prov).trim()===String(c.prov).trim()){exist=S.cities[i];break;}
  if(exist){
    aiStatus('✖ 「'+c.name+'（'+c.prov+'）」已存在，请勿重复添加；已为你打开该城详情，要改内容请点「编辑全部字段」。','warn');
    go('cities');openView(exist.id);return;
  }
  var r=aiWrite(c,false);
  var kindNote=(AI.resultKind==='local')?'（本地通用框架，不是 AI 采编；请在后台补齐真实内容）':'';
  aiStatus(r.ok?('✓ 已新增「'+r.name+'」'+kindNote):('✖ '+r.msg), r.ok?'ok':'warn');
}

/* 批量补齐：把框架城逐城升级为带检索的真实内容。
   用户本机连得上魔塔时跑完全部，导出 cities.full.js 并 push 即全站生效。 */
var AIBATCH={running:false,stop:false,done:0,fail:0,total:0};
async function aiBatch(limit){
  if(AIBATCH.running){aiStatus('批量任务正在进行中','warn');return;}
  var c=aiCfg();
  if(!c.token||!c.model){aiStatus('请先填 Token 并点「🔌 连接测试」拉取可用模型','err');return;}
  var targets=S.cities.filter(function(x){return !x.baseline && x.contentStatus!=='ai_generated';});
  if(limit&&limit>0)targets=targets.slice(0,limit);
  if(!targets.length){aiStatus('✓ 没有待补齐的框架城','ok');return;}
  AIBATCH={running:true,stop:false,done:0,fail:0,total:targets.length};
  aiStatus('批量补齐开始：共 '+AIBATCH.total+' 城，逐城检索 + 生成 + 覆盖升级…','warn');
  for(var i=0;i<targets.length;i++){
    if(AIBATCH.stop)break;
    var nm=targets[i].name;
    c.name=nm;c.prov=lookupProv(nm)||'';aiSave();
    AI.result=null;AI.resultKind=null;
    try{await aiGenerate();}catch(e){}
    /* 双保险：本地框架/失败结果绝不写回城市，避免把 374 城冒充成「AI 升级」 */
    if(AI.result&&AI.resultKind==='ai'){
      var r=aiWrite(AI.result,true);
      if(r.ok)AIBATCH.done++;else AIBATCH.fail++;
    }else AIBATCH.fail++;
    aiStatus('批量补齐 '+(i+1)+'/'+AIBATCH.total+' · 成功 '+AIBATCH.done+' · 失败 '+AIBATCH.fail
      +' · 当前 '+nm+(AIBATCH.stop?'（已停止）':''),AIBATCH.stop?'warn':'ok');
  }
  AIBATCH.running=false;
  aiStatus('批量补齐结束：成功 '+AIBATCH.done+' 城 / 失败 '+AIBATCH.fail+' 城。'
    +'到「导入 / 导出」下载 cities.full.js 覆盖仓库并 push，全站访客即可看到真实内容。','ok');
  log('AI 批量补齐',AIBATCH.done+' 成功',AIBATCH.fail+' 失败');saveAll();
}
function aiBatchStop(){if(AIBATCH.running){AIBATCH.stop=true;aiStatus('已请求停止，当前城完成后停下','warn');}}
function aiBatchStatus(){return {running:AIBATCH.running,done:AIBATCH.done,fail:AIBATCH.fail,total:AIBATCH.total};}

/* ---------------- 日志 ---------------- */
function vLogs(){
  $('view').innerHTML='<div class="card"><h2>操作日志（最近 200 条）</h2>'
   +'<div class="toolbar"><span class="hint">每次增删改、导入、导出、视觉调整都会留痕</span>'
   +'<span class="sp"></span><button class="btn sm danger" onclick="clearLogs()">清空日志</button></div>'
   +'<div class="logs">'+logRows(S.logs)+'</div></div>';
}
function clearLogs(){if(!confirm('清空全部操作日志？'))return;S.logs=[];saveAll();vLogs();toast('已清空');}

/* ---------------- 启动 ---------------- */
load();renderMenu();syncDraft();render();
window.XJ_ADMIN={state:function(){return S;},page:function(){return PAGE;},
  go:go,save:saveAll,openEdit:openEdit,openView:openView,find:find,
  filtered:filtered,validate:validateCity,exportFull:exportFull,exportPlan:exportPlan,
  runCheck:runCheck,doImport:doImport,duplicateGroups:duplicateGroups,
  aiGenerate:aiGenerate,aiApply:aiApply,aiCfg:aiCfg,aiNormalize:aiNormalize,
  aiBatch:aiBatch,aiBatchStatus:aiBatchStatus,aiBatchStop:aiBatchStop,
  aiWrite:aiWrite,normCityName:normCityName,cityKey:cityKey,lookupProv:lookupProv,
  aiFetchModels:aiFetchModels,aiRefreshModels:aiRefreshModels,aiTest:aiTest,
  aiModelOpts:aiModelOpts,aiSetModel:aiSetModel,aiHumanError:aiHumanError,
  aiModels:function(){return AI.modelList;},aiVerified:function(){return AI.modelsVerified;},
  aiConn:function(){return AI.conn;},aiLast:function(){return AI.result;},
  aiStatus:function(){return AI.lastStatus;},aiSetStatus:aiStatus,
  aiModelFromApi:function(){return {verified:AI.modelsVerified,ids:(AI.modelList||[]).map(function(m){return m.id;})};},
  aiLastGen:function(){return AI.lastGen;},aiWikiFail:function(){return AI.wikiFail;},
  aiLastFail:function(){return AI.lastFail;},aiLocalFallback:aiLocalFallback,
  aiResultKind:function(){return AI.resultKind;},aiRetryBrief:function(){return AI.retryBrief;},
  aiWikiSource:function(){return AI.wikiSource;},
  aiExportStatusData:function(){
    var c=aiCfg();return {resultKind:AI.resultKind,retriedBrief:AI.retryBrief,
      wikiSourceHit:AI.wikiSource,wikiSources:(AI_CFG.wikiSources||[]).map(function(x){return x.name;}),
      timeouts:{models:AI_CFG.modelsTimeoutMs,ping:AI_CFG.pingTimeoutMs,
                wiki:AI_CFG.wikiTimeoutMs,gen:AI_CFG.genTimeoutMs},model:String(c.model||'')};},
  aiBriefPrompt:aiPromptBrief,aiCall:aiCall,aiWiki:aiWiki};
</script>
